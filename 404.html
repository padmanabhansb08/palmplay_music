<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found – PalmPlay</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/png" href="/app/assets/gallery/p1.png">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
               background: radial-gradient(circle at 50% 30%, #3a0010, #000 70%); color: #fff;
               font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        .box { max-width: 420px; }
        .logo { font-size: 28px; font-weight: 800; color: #ff1744; letter-spacing: -.02em; margin-bottom: 28px; }
        h1 { font-size: 56px; margin: 0 0 8px; line-height: 1; }
        p { color: #b3b3b3; margin: 0 0 28px; line-height: 1.5; }
        a { display: inline-block; background: #ff1744; color: #fff; text-decoration: none; font-weight: 700;
            padding: 14px 32px; border-radius: 999px; }
        a:hover, a:focus-visible { background: #ff3d63; outline: none; }
    </style>
</head>
<body>
    <main class="box">
        <div class="logo">PalmPlay</div>
        <h1>404</h1>
        <p>That page doesn't exist — but the music is still playing somewhere else.</p>
        <a href="/app">Back to PalmPlay</a>
    </main>
</body>
</html>
